server {
    listen 80 default_server;

    # --- ΤΟ ΝΕΟ "ΔΟΛΩΜΑ" ---
    # Ορίζουμε μια τοποθεσία "δόλωμα"
    location / {
        # Απλά λέμε "return 404".
        # Ο Nginx θα στείλει τη δική του default 404 σελίδα.
        # Αυτό ΔΕΝ συγκρούεται με το ModSecurity.
        return 404;
    }

    # --- (Προαιρετικό) Κάνουμε το 404 "ωραίο" ---
    # error_page 404 /404.html;
    # location = /404.html {
    #     root /usr/share/nginx/html; # Ένας φάκελος που υπάρχει
    #     internal;
    # }
}